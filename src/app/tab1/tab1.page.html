<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Add Product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Add Product</ion-title>
    </ion-toolbar>
  </ion-header>

  <h2>Add Product</h2>
  <ion-item>
    <ion-input placeholder="Product Name" [(ngModel)]="newProduct.productName"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input type="number" placeholder="Price" [(ngModel)]="newProduct.price"></ion-input>
  </ion-item>
  <ion-item>
    <ion-select placeholder="Category" [(ngModel)]="newProduct.category">
      <ion-select-option *ngFor="let category of categories" [value]="category">
        {{ category }}
      </ion-select-option>
    </ion-select>
  </ion-item>
  <ion-item>
    <ion-input type="number" placeholder="Quantity" [(ngModel)]="newProduct.quantity"></ion-input>
  </ion-item>
  <ion-button expand="block" (click)="addProduct()">Add Product</ion-button>
</ion-content>
