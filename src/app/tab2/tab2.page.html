<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Products</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Products</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar [(ngModel)]="searchTerm" (ionInput)="filterProducts()" placeholder="Search products..."></ion-searchbar>
  <ion-segment [(ngModel)]="selectedCategory" (ionChange)="filterProducts()" scrollable="true">
    <ion-segment-button *ngFor="let cat of categories" [value]="cat">
      <ion-label>{{ cat }}</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list>
    <ion-item-sliding *ngFor="let product of filteredProducts">
      <ion-item>
        <ion-label>
          <h2>{{ product.productName }}</h2>
          <p>{{ product.category }}</p>
          <p>Price: {{ product.price }} | Quantity: {{ product.quantity }}</p>
        </ion-label>
        <ion-button size="small" (click)="updateProduct(product)">Edit</ion-button>
      </ion-item>

      <ion-item-options side="end">
        <ion-button color="danger" (click)="deleteProduct(product.id)">Delete</ion-button>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-text *ngIf="filteredProducts.length === 0" color="medium">
    <p>No products found.</p>
  </ion-text>
</ion-content>
