name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: windows-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

  deploy:
    name: Continuous Deployment
    needs: ci
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Check Docker access
        run: docker info

      - name: Build Docker image
        run: docker build -t user-crud:latest .

      - name: Remove previous container
        run: docker rm -f user-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name user-crud --restart unless-stopped -p 8100:8100 user-crud:latest

      - name: Verify application
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:8100 -UseBasicParsing -TimeoutSec 5 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs user-crud
            exit 1
          }