name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Para pwede mo i-run manually galing sa phone mo

permissions:
  contents: read

jobs:
  # PART F: Continuous Integration (GitHub Cloud)
  continuous-integration:
    name: Continuous Integration
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run automated tests
        shell: pwsh
        continue-on-error: true # Para hindi mag-fail kung walang tests
        run: npm test -- --watch=false

      - name: Build application
        shell: pwsh
        run: npm run build

  # PART G: Continuous Deployment (Self-Hosted Windows PC)
  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Check Docker access
        shell: pwsh
        run: docker info

      - name: Build Docker image
        shell: pwsh
        run: docker build -t user-crud:latest .

      - name: Remove previous container
        shell: pwsh
        continue-on-error: true
        run: docker rm -f ionic-crud

      - name: Start updated container
        shell: pwsh
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:8100 user-crud:latest

      - name: Verify application
        shell: pwsh
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:8100" -UseBasicParsing -TimeoutSec 5 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }